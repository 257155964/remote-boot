<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>远程开机 · 启动版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232B6BE4' d='M12 2a1 1 0 0 1 1 1v7a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1z'/%3E%3Cpath fill='%231C2536' d='M6.3 5.7a1 1 0 0 1 0 1.4A8 8 0 1 0 17.7 7.1a1 1 0 1 1 1.4-1.4 10 10 0 1 1-14.2 0 1 1 0 0 1 1.4 0z'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F4F6FA;--card:#FFFFFF;--line:#E4E9F2;
  --text:#1C2536;--mut:#687792;--acc:#2B6BE4;--acc-dim:#EAF1FE;
  --mono:Consolas,"Cascadia Mono","Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:var(--acc-dim);display:grid;place-items:center;margin:0 auto}
h1{font-size:22px;font-weight:700;letter-spacing:.3px}
.sub{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(28,37,54,.06)}
.dev-name{font-size:17px;font-weight:700}
.dev-meta{font-family:var(--mono);font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.dev-meta b{color:var(--text);font-weight:600;font-family:var(--sans);margin-right:6px}
.wake-btn{
  width:100%;background:var(--acc);color:#fff;border:none;border-radius:12px;
  padding:17px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:.15s;cursor:pointer;
}
.wake-btn:hover{background:#1E56C4}
.wake-btn:active{transform:scale(.98)}
.wake-btn svg{width:20px;height:20px}
.tip{font-size:12px;color:var(--mut)}
.tip b{color:var(--acc)}
.hint-box{border:1px dashed #B9C4D8;border-radius:12px;padding:16px;font-size:13px;color:var(--mut)}
.hint-box b{color:var(--text)}
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2B6BE4" stroke-width="2.2" stroke-linecap="round" width="28" height="28"><path d="M12 2v9"/><path d="M18.4 6.6a8 8 0 1 1-12.8 0"/></svg>
  </div>
  <div>
    <h1>远程开机</h1>
    <div class="sub">点一下，唤醒家里的电脑</div>
  </div>

  <div class="card" id="devCard" style="display:none">
    <div class="dev-name" id="dName"></div>
    <div class="dev-meta">
      <div><b>MAC</b><span id="dMac"></span></div>
      <div><b>地址</b><span id="dIp"></span></div>
    </div>
    <button class="wake-btn" id="wakeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v9"/><path d="M18.4 6.6a8 8 0 1 1-12.8 0"/></svg>
      开机
    </button>
    <div class="tip">点击后打开发送页面，点一下 <b>Send</b> 即发送唤醒包，约 1 分钟内电脑启动。</div>
  </div>

  <div class="hint-box" id="noDev" style="display:none">
    <b>这个页面没有绑定电脑。</b><br><br>
    请先在「远程开机-设置版.html」里添加电脑并复制开机链接，再打开带链接的启动版。<br><br>
    或者直接使用设置版生成的手机开机链接。
  </div>

  <div class="tip" id="footTip">发送不依赖任何账号 · 前提：电脑已开网络唤醒 + 路由器已做端口转发</div>
</main>

<script>
const qs = {};
(function(){
  const p = new URLSearchParams(location.search);
  if(p.get('mac')) qs = { name:p.get('name')||'我的电脑', mac:p.get('mac'), ip:p.get('ip')||'', port:p.get('port')||'9' };
})();

const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtMac(m){
  m = (m||'').toUpperCase().replace(/[^0-9A-F]/g,'');
  if(m.length===12) return m.replace(/(.{2})(?=.)/g,'$1:');
  return m;
}

if(qs.mac){
  document.getElementById('devCard').style.display = 'flex';
  document.getElementById('noDev').style.display = 'none';
  document.getElementById('dName').textContent = qs.name;
  document.getElementById('dMac').textContent = fmtMac(qs.mac);
  document.getElementById('dIp').textContent = (qs.ip||'—') + ' : ' + qs.port;
  document.getElementById('wakeBtn').addEventListener('click', ()=>{
    const mac = qs.mac.replace(/[^0-9A-Fa-f]/g,'');
    const url = `https://www.depicus.com/wake-on-lan/woli?m=${mac}&i=${encodeURIComponent(qs.ip)}&s=255.255.255.255&p=${qs.port||'9'}`;
    window.open(url, '_blank');
  });
}else{
  document.getElementById('noDev').style.display = 'block';
}
</script>
</body>
</html>
